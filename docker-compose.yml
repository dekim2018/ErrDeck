# 로컬 개발용 저장소. 포트는 팬파라이브, CoPage와 함께 띄워도 겹치지 않게 잡았다(WORKFLOW.md 3장).
# 프로세스 컨테이너, CPU와 메모리 상한, obs 프로필은 16 작업에서 더한다.
# demo 프로필(17.3): 데모 앱과 loadgen. jar 를 먼저 만들고 띄운다.
#   ./gradlew :demo-api:bootJar :loadgen:installDist
#   docker compose exec -T postgres psql -U errdeck < scripts/demo/seed.sql
#   docker compose --profile demo up -d demo-api
#   docker compose --profile demo run --rm loadgen http --url=http://demo-api:8090/demo/ok --rate=200 --duration=30s
name: errdeck

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: errdeck
      POSTGRES_USER: errdeck
      POSTGRES_PASSWORD: errdeck
    ports:
      - "${ERRDECK_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errdeck -d errdeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    # 대기열을 담으므로 재시작 후에도 남게 AOF를 켜고, 메모리가 차면 지우지 않고 쓰기를 거부하게 한다(adr/0002).
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - "${ERRDECK_REDIS_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse:26.3
    environment:
      CLICKHOUSE_DB: errdeck
      CLICKHOUSE_USER: errdeck
      CLICKHOUSE_PASSWORD: errdeck
      # 06 작업에서 worker용, api용 사용자를 SQL로 만들 수 있게 한다.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${ERRDECK_CLICKHOUSE_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user errdeck --password errdeck --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  demo-api:
    profiles: [demo]
    build:
      context: .
      dockerfile: demo-api/Dockerfile
    environment:
      # ingest 는 16 작업 전까지 호스트에서 띄운다.
      DEMO_ERRDECK_DSN: ${DEMO_ERRDECK_DSN:-http://demoapikey@host.docker.internal:8080/9001}
      DEMO_ERRDECK_ENABLED: ${DEMO_ERRDECK_ENABLED:-true}
      DEMO_ENVIRONMENT: compose
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEMO_PORT:-8090}:8090"

  loadgen:
    profiles: [demo]
    build:
      context: .
      dockerfile: loadgen/docker/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: 빌드와 테스트
        run: ./gradlew build

  # 콘솔 화면(12장). 타입 검사와 빌드, 단위 테스트.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사와 빌드
        run: npm run build

      - name: 테스트
        run: npm test

  # Vue SDK(11.3)와 그것을 붙인 데모 화면. 데모 화면은 SDK 의 빌드 결과를 쓰므로 SDK 를 먼저 빌드한다.
  sdk-vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: SDK 의존성 설치, 테스트, 빌드
        working-directory: sdk-vue
        run: |
          npm ci
          npm test
          npm run build
          npm run size

      - name: 데모 화면 빌드
        working-directory: demo-web
        run: |
          npm ci
          npm run build


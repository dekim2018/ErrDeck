spring:
  application:
    name: errdeck-worker
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml 과 같다. 배포 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://${ERRDECK_DB_HOST:localhost}:${ERRDECK_DB_PORT:15432}/errdeck
    username: ${ERRDECK_DB_USER:errdeck}
    password: ${ERRDECK_DB_PASSWORD:errdeck}
    hikari:
      # 쓰기 스레드 하나와 업타임, 알림의 상태 갱신(14.6)
      maximum-pool-size: 4
      # 밀리초 단위다.
      connection-timeout: 2000
  jdbc:
    template:
      # worker 에서 PostgreSQL 은 2초. 넘으면 묶음을 다시 쓴다(14.9).
      query-timeout: 2s
  data:
    redis:
      host: ${ERRDECK_REDIS_HOST:localhost}
      port: ${ERRDECK_REDIS_PORT:16379}
      # 읽기는 최대 1초 기다리는 블로킹 호출이므로 그보다 길게 둔다. 3초로는 시작 직후의 GC 멈춤(3.1초)에 걸려 5초로 늘렸다.
      timeout: 5s
      connect-timeout: 1s
  lifecycle:
    # 읽기를 멈추고 처리 중인 묶음을 쓰고 확인 처리하는 데 주는 시간(17.6)
    timeout-per-shutdown-phase: 30s

server:
  port: ${ERRDECK_WORKER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        errdeck.e2e.latency: true
        http.server.requests: true

# 값은 14.3, 14.5, 10.4, 14.9 를 따른다. 17 작업의 자원 실험으로 다시 맞춘다.
errdeck:
  worker:
    consumer-group: errdeck-workers
    read-count: 500
    read-block: 1s
    handoff-capacity: 2000
    compute-threads: 2
    events-per-transaction: 3
    # 봉투 수가 아니라 이벤트 수다. 봉투 하나에 50건까지 든다.
    write-queue-capacity: 10000
    batch-max-rows: 5000
    batch-max-wait: 1s
    claim-interval: 30s
    claim-min-idle: 60s
    retry-max-backoff: 10s
    shutdown-timeout: 30s
    # SDK 가 in_app 을 정하지 않은 프레임을 앱 프레임으로 볼 패키지(6.3)
    in-app-packages: []
    max-process-attempts: 3
    issue-cache-size: 50000
    # 이슈별 분당 원본 저장 상한(10.3). 넘는 것은 건수만 남긴다.
    samples-per-issue-per-minute: 100
    seen-ttl: 1h
    # 소스맵 볼륨. api 의 errdeck.files.dir 과 같은 경로다(7.2).
    files-dir: ${ERRDECK_FILES_DIR:./data/artifacts}
    # 해석한 소스맵 캐시. 힙 448MB 중 128MB(14.7).
    sourcemap-cache-size: 128MB
  clickhouse:
    url: http://${ERRDECK_CLICKHOUSE_HOST:localhost}:${ERRDECK_CLICKHOUSE_PORT:18123}
    database: errdeck
    user: errdeck_worker
    password: ${ERRDECK_CLICKHOUSE_WORKER_PASSWORD:errdeck_worker}
    timeout: 10s
  # 알림 메시지의 링크가 가리키는 콘솔 주소(16.3).
  console-url: ${ERRDECK_CONSOLE_URL:http://localhost:5173}
  uptime:
    # 내부 주소지만 점검과 웹훅을 허용할 호스트(9.4). 쉼표로 나눈다. 로컬 개발은 같은 도커 네트워크의 데모 앱.
    allowed-hosts: ${ERRDECK_UPTIME_ALLOWED_HOSTS:}

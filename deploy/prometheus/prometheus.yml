# 같은 도커 네트워크의 대상을 직접 수집한다(13.2). 다른 서버의 대상은 에이전트가 원격 쓰기로 보낸다(13.3).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ingest
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ingest:8091"]
  - job_name: worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:8091"]
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8091"]
  # 감시 대상. job 이름은 콘솔의 프로젝트 슬러그와 같아야 성능 화면이 찾는다(8.1).
  - job_name: demo-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["demo-api:8090", "demo-api-downstream:8090"]
  # 같은 맥에서 띄운 CoPage 앱(로컬 연결, docs/INTEGRATION.md). 관리 포트를 0.0.0.0 으로 열어야 닿는다.
  # 띄우지 않았으면 up=0 으로 남을 뿐이다.
  - job_name: copage-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  # 같은 맥에서 띄운 팬파라이브 서비스(로컬 연결). 관리 포트가 없어 서비스 포트에서 긁는다.
  # 팬파라이브를 MANAGEMENT_EXPOSURE=health,prometheus 로 띄워야 열린다.
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
  - job_name: broadcast-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
  - job_name: interaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
  - job_name: fandom-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # 이 프로젝트의 컨테이너만 compose 의 서비스 이름으로 부른다. 대시보드와 경보가 이 이름을 쓴다.
      # 같은 서버의 다른 프로젝트(CoPage 의 postgres 등)는 service 가 비어 빠진다.
      - source_labels: [container_label_com_docker_compose_project, container_label_com_docker_compose_service]
        regex: errdeck;(.+)
        target_label: service
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

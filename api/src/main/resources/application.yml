spring:
  application:
    name: errdeck-api
  # 요청을 받아 저장소 응답을 기다리는 일이 대부분이라 가상 스레드를 켠다(adr/0009).
  threads:
    virtual:
      enabled: true
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml 과 같다. 배포 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://${ERRDECK_DB_HOST:localhost}:${ERRDECK_DB_PORT:15432}/errdeck
    username: ${ERRDECK_DB_USER:errdeck}
    password: ${ERRDECK_DB_PASSWORD:errdeck}
    hikari:
      maximum-pool-size: 10

server:
  port: ${ERRDECK_API_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

errdeck:
  clickhouse:
    url: http://${ERRDECK_CLICKHOUSE_HOST:localhost}:${ERRDECK_CLICKHOUSE_PORT:18123}
    database: errdeck
    # 스키마를 만드는 관리 사용자. 로컬 개발용 기본값이고 배포 환경은 환경 변수로 덮어쓴다.
    user: ${ERRDECK_CLICKHOUSE_USER:errdeck}
    password: ${ERRDECK_CLICKHOUSE_PASSWORD:errdeck}
    timeout: 10s
    migrate: true
    worker-user: errdeck_worker
    worker-password: ${ERRDECK_CLICKHOUSE_WORKER_PASSWORD:errdeck_worker}
    api-user: errdeck_api
    api-password: ${ERRDECK_CLICKHOUSE_API_PASSWORD:errdeck_api}

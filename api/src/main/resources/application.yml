spring:
  application:
    name: errdeck-api
  # 요청을 받아 저장소 응답을 기다리는 일이 대부분이라 가상 스레드를 켠다(adr/0009).
  threads:
    virtual:
      enabled: true
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml 과 같다. 배포 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://${ERRDECK_DB_HOST:localhost}:${ERRDECK_DB_PORT:15432}/errdeck
    username: ${ERRDECK_DB_USER:errdeck}
    password: ${ERRDECK_DB_PASSWORD:errdeck}
    hikari:
      maximum-pool-size: 10
      # 커넥션 획득 제한(14.6). 기본 30초면 DB 가 느릴 때 요청이 30초씩 매달려 쌓인다. 밀리초 단위다.
      connection-timeout: 2000
  data:
    redis:
      host: ${ERRDECK_REDIS_HOST:localhost}
      port: ${ERRDECK_REDIS_PORT:16379}
      timeout: 1s

server:
  port: ${ERRDECK_API_PORT:8081}
  tomcat:
    # 동시 연결 상한. 가상 스레드에는 천장이 없어 조회가 몰리면 기다리는 요청이 힙에 쌓인다(14.4).
    # 17 작업에서 초당 300번의 이슈 목록 조회에 힙 256MB 가 넘쳤다.
    max-connections: 200
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

errdeck:
  # Redis 가 다른 주소로 다시 떠도 따라가게 한다(14.9 끝). 도커 내장 DNS 의 TTL 은 600초다.
  redis:
    dns-max-ttl: 5s
    reconnect-max-delay: 2s
  clickhouse:
    url: http://${ERRDECK_CLICKHOUSE_HOST:localhost}:${ERRDECK_CLICKHOUSE_PORT:18123}
    database: errdeck
    # 스키마를 만드는 관리 사용자. 로컬 개발용 기본값이고 배포 환경은 환경 변수로 덮어쓴다.
    user: ${ERRDECK_CLICKHOUSE_USER:errdeck}
    password: ${ERRDECK_CLICKHOUSE_PASSWORD:errdeck}
    timeout: 10s
    migrate: true
    worker-user: errdeck_worker
    worker-password: ${ERRDECK_CLICKHOUSE_WORKER_PASSWORD:errdeck_worker}
    api-user: errdeck_api
    api-password: ${ERRDECK_CLICKHOUSE_API_PASSWORD:errdeck_api}
  auth:
    # HS256 서명 키. 32바이트 이상. 로컬 개발용 기본값이며 배포 환경은 반드시 ERRDECK_JWT_SECRET 으로 바꾼다(25 작업).
    jwt-secret: ${ERRDECK_JWT_SECRET:local-development-only-secret-change-me-0123456789}
    issuer: errdeck
    audience: errdeck-console
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    # 쓴 리프레시 토큰이 이 시간 안에 다시 오면 탈취가 아니라 동시 재발급(탭 두 개, 재시도)으로 본다.
    refresh-reuse-grace: 10s
    # 로컬은 http 라 false. 배포 환경은 true(25 작업).
    secure-cookie: ${ERRDECK_SECURE_COOKIE:false}
    signup-enabled: ${ERRDECK_SIGNUP_ENABLED:true}
    # 로그인 실패가 반복되면 응답을 늦춘다(15.2).
    failures-before-delay: 5
    failure-delay: 1s
    failure-window: 10m
    # Alertmanager 가 /api/internal/** 에 보내는 공유 비밀(15.1).
    internal-secret: ${ERRDECK_INTERNAL_SECRET:local-internal-secret}
  console:
    # DSN 을 만들 때 쓰는 ingest 의 바깥 주소.
    ingest-url: ${ERRDECK_PUBLIC_INGEST_URL:http://localhost:8080}
    # 콘솔 개발 서버(Vite)가 API 를 부를 수 있는 출처.
    allowed-origins: ${ERRDECK_CONSOLE_ORIGINS:http://localhost:5173}
    # 이슈 상세의 그라파나 링크(12.4). 16 작업에서 compose 의 그라파나 주소로 맞춘다.
    grafana-url: ${ERRDECK_GRAFANA_URL:http://localhost:3000}
  uptime:
    # 내부 주소지만 모니터와 웹훅으로 허용할 호스트(9.4). worker 와 같게 둔다.
    allowed-hosts: ${ERRDECK_UPTIME_ALLOWED_HOSTS:}
  prometheus:
    # 성능 화면의 엔드포인트 표와 통합 화면의 요약 카드(8.1, 12.2). 못 읽으면 표본 표와 빈 카드로 보인다.
    url: ${ERRDECK_PROMETHEUS_URL:http://localhost:19090}
  files:
    # 소스맵 볼륨(7.2). worker 도 같은 경로를 쓴다. compose 에서는 공유 볼륨을 붙인다(16 작업).
    dir: ${ERRDECK_FILES_DIR:./data/artifacts}
    max-artifact-size: 20MB


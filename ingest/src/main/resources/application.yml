spring:
  application:
    name: errdeck-ingest
  # 요청을 받아 저장소 응답을 기다리는 일이 대부분이라 가상 스레드를 켠다(adr/0009).
  threads:
    virtual:
      enabled: true
  # 로컬 개발용 기본값. 저장소 루트의 docker-compose.yml 과 같다. 배포 환경은 환경 변수로 덮어쓴다.
  datasource:
    url: jdbc:postgresql://${ERRDECK_DB_HOST:localhost}:${ERRDECK_DB_PORT:15432}/errdeck
    username: ${ERRDECK_DB_USER:errdeck}
    password: ${ERRDECK_DB_PASSWORD:errdeck}
    hikari:
      # 키 캐시가 비었을 때만 조회한다(14.6).
      maximum-pool-size: 2
      # 밀리초 단위다.
      connection-timeout: 1000
  jdbc:
    template:
      query-timeout: 1s
  data:
    redis:
      host: ${ERRDECK_REDIS_HOST:localhost}
      port: ${ERRDECK_REDIS_PORT:16379}
      # Redis 가 느리면 기다리지 않고 503 을 응답한다(14.9).
      timeout: 200ms
      connect-timeout: 200ms

server:
  port: ${ERRDECK_INGEST_PORT:8080}
  tomcat:
    # 동시 연결 상한(14.3). 가상 스레드에는 스레드 풀이라는 천장이 없으므로 연결 수로 힙에 쌓이는 요청을 묶는다(14.7).
    # 처음 값 2,000 은 힙 160MB 에서 연결마다 잡히는 톰캣 버퍼 때문에 GC 가 멈추지 않아 500 으로 줄였다(EXPERIMENTS 17 작업).
    max-connections: 500
    # 상한에 닿은 뒤 커널이 받아 둘 연결 수. 넘으면 연결을 거절하고 SDK 는 버린 건수를 센다.
    accept-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      # 12.2 의 p95 를 구하려면 요청 시간을 히스토그램으로 내보내야 한다(13.2).
      percentiles-histogram:
        http.server.requests: true

# 값은 5.3, 5.4, 5.5, 14.4 를 따른다. 18장의 실험 결과로 다시 맞춘다.
errdeck:
  ingest:
    max-envelope-size: 200KB
    key-cache:
      ttl: 30s
      max-size: 10000
    rate-limit:
      burst: 1000
      bucket-ttl: 2m
    queue:
      events-max-length: 20000
      tx-max-length: 20000
      full-retry-after: 5s
      metrics-interval: 5s
    redis:
      max-in-flight: 256
